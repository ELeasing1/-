<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка · Благо Дарю</title>
<link rel="icon" href="../images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F1F6FA; --paper:#FFFFFF; --ink:#122A1E; --ink-2:#465A50; --ink-3:#6B7D74; --line:#D8E3E9; --line-2:#C5D3DB;
  --leaf:#17633B; --leaf-2:#1F7A49; --forest:#0C3622; --gold:#D4A646; --gold-2:#F1D186; --gold-soft:#FBF3DF;
  --red:#B4372B; --red-soft:#FBE9E7; --sky-2:#5AA7DD;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(12,54,34,.06),0 12px 30px -16px rgba(12,54,34,.3);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-2);outline-offset:2px;border-radius:6px}
a{color:var(--leaf)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--paper);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--leaf)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-main{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn-main:hover{background:var(--leaf-2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--forest)}
.btn-gold:hover{background:var(--gold-2)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--red)}
.btn-danger:hover{border-color:var(--red)}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-3)}
.icon-btn:hover{background:var(--bg);color:var(--ink);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--red);background:var(--red-soft)}

/* Вход */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:460px;background:var(--paper);border-radius:20px;padding:32px;box-shadow:var(--shadow);display:grid;gap:18px}
.login-card h1{margin:0;font-size:22px;line-height:1.25}
.login-card p{margin:0;color:var(--ink-2)}
.logo{width:56px;height:56px;border-radius:50%;background:#A9D6F2 url(../images/logo.jpg) 50% 30%/200% no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--gold)}
.howto{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.howto summary{cursor:pointer;font-weight:700;color:var(--ink)}
.howto ol{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Поля */
.f{display:grid;gap:6px}
.f > label,.f-label{font-weight:700;font-size:13px;color:var(--ink-2)}
.f .hint{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.inp,.ta,.sel{width:100%;border:1.5px solid var(--line-2);background:var(--paper);border-radius:10px;padding:9px 12px;min-height:40px;transition:border-color .15s}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--leaf);outline:none}
.ta{resize:vertical;line-height:1.5;min-height:84px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--leaf)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Каркас */
.top{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top .logo{width:36px;height:36px}
.top b{font-size:15px}
.top .repo{font-size:12px;color:#A8C3B2}
.top .sp{flex:1}
.status{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#EAF3EC}
.status.dirty{background:var(--gold-soft);color:#8A6216}
.top .btn{border-color:rgba(255,255,255,.25);background:transparent;color:#fff}
.top .btn:hover{border-color:#fff}
.top .btn-gold{background:var(--gold);border-color:var(--gold);color:var(--forest)}
.top .btn-gold:hover{background:var(--gold-2)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding:20px 16px 80px;align-items:start}
.side{position:sticky;top:76px;background:var(--paper);border-radius:16px;padding:10px;box-shadow:var(--shadow);display:grid;gap:4px;max-height:calc(100vh - 96px);overflow:auto}
.side-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.side-item{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px 2px 2px 0}
.side-item.on{background:#E3F0E8}
.side-item.off .side-btn{opacity:.5}
.side-btn{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;display:grid;gap:0}
.side-btn b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-btn span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item .icon-btn{width:28px;height:28px}
.side-add{display:flex;gap:6px;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
.side-add .sel{min-height:34px;padding:4px 8px;font-size:13px}
.mob-nav{display:none}
.main{display:grid;gap:16px;min-width:0}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:grid;gap:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:20px}
.card-h .muted{font-size:13px;color:var(--ink-3)}
.banner{background:var(--gold-soft);border:1px solid #EBD9A8;color:#6B4C10;border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:600}
.banner .sp{flex:1}

/* Списки */
.list{display:grid;gap:8px}
.item{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-width:0}
.item.open{border-color:var(--line-2)}
.item-h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px}
.item-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:4px 0}
.item-t .num{font-size:12px;font-weight:800;color:var(--ink-3);width:20px;flex:none}
.item-t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}
.item-b{padding:4px 14px 14px;display:grid;gap:14px;border-top:1px solid var(--line)}
.item-b .f:first-child{margin-top:10px}
.list-foot{display:flex;flex-wrap:wrap;gap:8px}
.group{border:1.5px dashed var(--line-2);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.group > legend{font-weight:700;font-size:13px;color:var(--ink-2);padding:0 6px}

/* Фото */
.imgf{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.thumb{width:132px;height:132px;border-radius:12px;background:var(--bg) center/cover no-repeat;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;color:var(--ink-3);font-size:12px;text-align:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .new{position:absolute;left:6px;top:6px;background:var(--gold);color:var(--forest);font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px}
.imgf-side{flex:1;min-width:220px;display:grid;gap:10px}
.imgf-btns{display:flex;flex-wrap:wrap;gap:6px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.imgs .cell{display:grid;gap:4px}
.imgs .thumb{width:100%;height:auto;aspect-ratio:1;cursor:pointer}
.imgs .thumb.sel{outline:3px solid var(--leaf)}
.cell-tools{display:flex;justify-content:center;gap:2px}
.vidf{display:grid;gap:10px}
.vid-name{font-size:13px;color:var(--ink-2);word-break:break-all}

/* Окна */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,22,14,.6);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--paper);border-radius:18px;width:100%;max-width:880px;max-height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px}
.modal-b{overflow:auto;padding:16px 18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.picker button{border:2px solid transparent;border-radius:12px;padding:0;background:var(--bg);aspect-ratio:1;overflow:hidden}
.picker button:hover{border-color:var(--leaf)}
.picker img{width:100%;height:100%;object-fit:cover}
.prev{position:fixed;inset:0;z-index:60;background:#0b1f15;display:grid;grid-template-rows:auto 1fr}
.prev-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;flex-wrap:wrap}
.prev-bar .sp{flex:1}
.prev-bar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.prev-bar .btn.on{background:#fff;color:var(--forest)}
.prev-stage{display:grid;justify-items:center;overflow:auto;padding:0 12px 12px}
.prev iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px;transition:width .2s}
.prev iframe.phone{width:390px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:80;background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--red)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(241,246,250,.75);display:grid;place-items:center;font-weight:800;color:var(--forest)}
.busy div{background:var(--paper);padding:18px 24px;border-radius:14px;box-shadow:var(--shadow)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding-top:12px}
  .side{display:none}
  .mob-nav{display:flex;gap:8px;align-items:center}
  .mob-nav .sel{flex:1}
  .row2{grid-template-columns:1fr}
  .card{padding:16px}
  .top{position:static;gap:8px}
  .top .repo{display:none}
  .top .btn{min-height:36px;padding:0 12px;font-size:13px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/render.js"></script>
<script src="admin.js"></script>
</body>
</html>
